<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>SpendSmart – Smart Personal Finance</title>
  <meta name="description" content="Track expenses, manage budgets, and gain smart financial insights with SpendSmart Web." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: '#2563EB',
            accent: '#3B82F6',
          }
        }
      }
    };
  </script>
  <!-- Firebase v9 compat -->
  <style>
    body { font-family: 'Inter', sans-serif; }
    .auth-container { min-height: 100dvh; }
    .auth-card { animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    .form-input { transition: border-color 0.2s, box-shadow 0.2s; }
    .form-input:focus { outline: none; border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .btn-primary { transition: all 0.2s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,235,0.3); }
    .btn-primary:active { transform: translateY(0); }
    .logo-pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
    /* Dark mode */
    .dark body { background: #0B1220; }
    .dark .auth-bg { background: #0B1220; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-gray-950 auth-container flex items-center justify-center p-4">

  <!-- Background decoration -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full bg-blue-100 dark:bg-blue-900/10 blur-3xl opacity-60"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full bg-indigo-100 dark:bg-indigo-900/10 blur-3xl opacity-60"></div>
  </div>

  <div class="relative w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl shadow-lg shadow-blue-500/25 mb-4 logo-pulse">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">SpendSmart</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Your personal finance companion</p>
    </div>

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="auth-card">
      <div class="bg-white dark:bg-gray-900 rounded-3xl shadow-xl shadow-slate-200/70 dark:shadow-black/30 p-6 border border-slate-100 dark:border-slate-800">
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white mb-1">Welcome back</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">Sign in to manage your finances</p>

        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Email</label>
            <input id="loginEmail" type="email" required autocomplete="email"
              class="form-input w-full px-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 text-sm placeholder:text-slate-400"
              placeholder="you@example.com" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Password</label>
            <div class="relative">
              <input id="loginPassword" type="password" required autocomplete="current-password"
                class="form-input w-full px-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 text-sm placeholder:text-slate-400 pr-10"
                placeholder="••••••••" />
              <button type="button" onclick="togglePasswordVisibility('loginPassword')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>

          <p id="loginError" class="text-xs text-red-500 font-medium min-h-[16px]"></p>

          <button id="loginBtn" type="submit"
            class="btn-primary w-full py-3 bg-blue-600 text-white font-semibold rounded-xl text-sm">
            Sign In
          </button>
        </form>

        <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-4">
          No account?
          <a href="#" id="showSignup" class="text-blue-600 font-semibold hover:underline">Create one</a>
        </p>
      </div>
    </div>

    <!-- SIGNUP SECTION -->
    <div id="signupSection" class="auth-card hidden">
      <div class="bg-white dark:bg-gray-900 rounded-3xl shadow-xl shadow-slate-200/70 dark:shadow-black/30 p-6 border border-slate-100 dark:border-slate-800">
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white mb-1">Create account</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">Start your financial journey today</p>

        <form id="signupForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Full Name</label>
            <input id="signupName" type="text" required autocomplete="name"
              class="form-input w-full px-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 text-sm placeholder:text-slate-400"
              placeholder="John Doe" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Email</label>
            <input id="signupEmail" type="email" required autocomplete="email"
              class="form-input w-full px-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 text-sm placeholder:text-slate-400"
              placeholder="you@example.com" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Password</label>
            <input id="signupPassword" type="password" required autocomplete="new-password" minlength="6"
              class="form-input w-full px-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 text-sm placeholder:text-slate-400"
              placeholder="Min. 6 characters" />
          </div>

          <p id="signupError" class="text-xs text-red-500 font-medium min-h-[16px]"></p>

          <button id="signupBtn" type="submit"
            class="btn-primary w-full py-3 bg-blue-600 text-white font-semibold rounded-xl text-sm">
            Create Account
          </button>
        </form>

        <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-4">
          Already have an account?
          <a href="#" id="showLogin" class="text-blue-600 font-semibold hover:underline">Sign In</a>
        </p>
      </div>
    </div>

    <p class="text-center text-xs text-slate-400 dark:text-slate-600 mt-6">
      Your data is encrypted and secure 🔒
    </p>
  </div>

  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    applyTheme();
    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
