<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>SpendSmart – Analytics</title>
  <meta name="description" content="Visualize your spending with interactive charts and gain smart financial insights." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .page-enter { animation: fadeIn 0.3s ease both; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    ::-webkit-scrollbar { width: 0; }
    .nav-active svg { color: #2563EB; }
    .nav-active span { color: #2563EB; font-weight: 600; }
    .fab-btn { box-shadow: 0 8px 24px rgba(37,99,235,0.4); }
    .tab-active { background: #2563EB; color: white; font-weight: 600; }
    .chart-wrap { position: relative; width: 100%; max-height: 220px; }
    .chart-wrap canvas { max-height: 220px !important; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-gray-950 min-h-screen pb-24">

  <div class="max-w-lg mx-auto">

    <!-- HEADER -->
    <header class="sticky top-0 z-30 bg-slate-50 dark:bg-gray-950 px-4 pt-4 pb-3">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold text-slate-900 dark:text-white">Analytics</h1>
        <!-- Month Nav -->
        <div class="flex items-center gap-2 bg-white dark:bg-gray-900 rounded-xl px-3 py-1.5 border border-slate-100 dark:border-slate-800 shadow-sm">
          <button id="prevMonth" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-colors p-0.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <span id="analyticsMonth" class="text-sm font-semibold text-slate-700 dark:text-slate-200 min-w-[100px] text-center"></span>
          <button id="nextMonth" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-colors p-0.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="px-4 space-y-4 page-enter">

      <!-- Summary Row -->
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-white dark:bg-gray-900 rounded-2xl p-3 border border-slate-100 dark:border-slate-800 text-center">
          <p class="text-xs text-slate-400 dark:text-slate-500 mb-0.5">Spent</p>
          <p id="analyticsTotalSpent" class="text-lg font-bold text-slate-800 dark:text-white">₹0</p>
        </div>
        <div class="bg-white dark:bg-gray-900 rounded-2xl p-3 border border-slate-100 dark:border-slate-800 text-center">
          <p class="text-xs text-slate-400 dark:text-slate-500 mb-0.5">Income</p>
          <p id="analyticsTotalIncome" class="text-lg font-bold text-emerald-500">₹0</p>
        </div>
        <div class="bg-white dark:bg-gray-900 rounded-2xl p-3 border border-slate-100 dark:border-slate-800 text-center">
          <p class="text-xs text-slate-400 dark:text-slate-500 mb-0.5">vs Last</p>
          <p id="spendingChange" class="text-lg font-bold text-slate-800 dark:text-white">—</p>
        </div>
      </div>

      <!-- Time Range Tabs -->
      <div class="bg-white dark:bg-gray-900 rounded-2xl border border-slate-100 dark:border-slate-800 overflow-hidden">
        <div class="flex bg-slate-100 dark:bg-gray-800 rounded-xl m-3 p-0.5 gap-0.5">
          <button class="range-tab tab-active flex-1 py-2 text-xs rounded-lg transition-all" data-range="daily">Daily</button>
          <button class="range-tab flex-1 py-2 text-xs text-slate-500 dark:text-slate-400 rounded-lg transition-all" data-range="weekly">Weekly</button>
          <button class="range-tab flex-1 py-2 text-xs text-slate-500 dark:text-slate-400 rounded-lg transition-all" data-range="monthly">Monthly</button>
          <button class="range-tab flex-1 py-2 text-xs text-slate-500 dark:text-slate-400 rounded-lg transition-all" data-range="6month">6 Month</button>
        </div>
        <div class="px-3 pb-3">
          <div class="chart-wrap">
            <canvas id="trendChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Pie Chart – compact -->
      <div class="bg-white dark:bg-gray-900 rounded-2xl p-4 border border-slate-100 dark:border-slate-800">
        <h2 class="font-semibold text-slate-800 dark:text-slate-100 text-sm mb-3">Spending by Category</h2>
        <div class="flex items-center gap-4">
          <div class="chart-wrap" style="max-width:150px; max-height:150px;">
            <canvas id="pieChart"></canvas>
          </div>
          <div id="pieLegend" class="flex-1 space-y-1.5 text-xs min-w-0"></div>
        </div>
        <div id="pieEmpty" class="hidden text-center py-4">
          <p class="text-sm text-slate-400 dark:text-slate-500">No expenses this month</p>
        </div>
      </div>

      <!-- Smart Insights -->
      <div class="bg-white dark:bg-gray-900 rounded-2xl p-4 border border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2 mb-3">
          <div class="w-6 h-6 bg-blue-100 dark:bg-blue-900/30 rounded-lg flex items-center justify-center">
            <svg class="w-3.5 h-3.5 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
          </div>
          <h2 class="font-semibold text-slate-800 dark:text-slate-100 text-sm">Smart Insights</h2>
        </div>
        <div id="insightsContainer" class="space-y-2"></div>
      </div>

    </main>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white dark:bg-gray-900 border-t border-slate-100 dark:border-slate-800 px-2 pt-2 pb-safe">
    <div class="flex items-center justify-around max-w-sm mx-auto relative">
      <a href="dashboard.html" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl">
        <svg class="w-5 h-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-xs text-slate-400 dark:text-slate-500">Home</span>
      </a>
      <a href="analytics.html" class="nav-item nav-active flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl">
        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
        <span class="text-xs text-blue-600 font-semibold">Analytics</span>
      </a>
      <a href="dashboard.html" class="fab-btn -mt-6 w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg transition-transform">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
      </a>
      <a href="budget.html" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl">
        <svg class="w-5 h-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        <span class="text-xs text-slate-400 dark:text-slate-500">Budget</span>
      </a>
      <a href="split.html" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl">
        <svg class="w-5 h-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="text-xs text-slate-400 dark:text-slate-500">Split</span>
      </a>
      <a href="profile.html" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl">
        <svg class="w-5 h-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs text-slate-400 dark:text-slate-500">Profile</span>
      </a>
    </div>
  </nav>

  <script src="js/firebase.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
