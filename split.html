<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>SpendSmart – Friends &amp; Lending</title>
  <meta name="description" content="Track money you owe or are owed. Manage splits and lending with friends." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } }
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .page-enter { animation: fadeIn 0.3s ease both; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    ::-webkit-scrollbar { width: 0; }
    .nav-active svg { color: #2563EB; }
    .nav-active span { color: #2563EB; font-weight: 600; }
    .modal-sheet { transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); }
    .modal-sheet.translate-y-0 { transform: translateY(0); }
    .form-input:focus { outline:none; border-color:#2563EB; box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
    .form-input { transition: border-color 0.2s, box-shadow 0.2s; }
    .split-chevron { transition: transform 0.25s ease; }
    .fab-btn { box-shadow: 0 8px 24px rgba(37,99,235,0.4); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-gray-950 min-h-screen pb-24">

  <div class="max-w-lg mx-auto">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-slate-50 dark:bg-gray-950 px-4 pt-4 pb-2">
    <div class="flex justify-between items-center">
      <h1 class="text-xl font-bold text-slate-900 dark:text-white">Friends &amp; Lending</h1>
      <button id="exportSplitPDF" title="Export" class="w-9 h-9 bg-white dark:bg-gray-900 border border-slate-100 dark:border-slate-800 rounded-xl flex items-center justify-center shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
        <svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </button>
    </div>
  </header>

  <main class="px-4 space-y-4 page-enter">

    <!-- Summary Card -->
    <div class="bg-gradient-to-r from-blue-500 to-cyan-500 rounded-3xl p-5 text-white shadow-lg shadow-blue-500/20">
      <div class="grid grid-cols-2 divide-x divide-white/20">
        <div class="pr-4">
          <p class="text-blue-100 text-xs font-medium mb-1">Total Owed to You</p>
          <p id="totalOwedToYou" class="text-3xl font-bold">₹0</p>
        </div>
        <div class="pl-4">
          <p class="text-blue-100 text-xs font-medium mb-1">You Owe Others</p>
          <p id="totalYouOwe" class="text-3xl font-bold">₹0</p>
        </div>
      </div>
    </div>

    <!-- Owed to You -->
    <div>
      <h2 class="font-semibold text-emerald-600 dark:text-emerald-400 text-sm mb-2 flex items-center gap-1.5">
        <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
        Owed to You
      </h2>
      <div id="owedToYouList" class="space-y-2">
        <p class="text-sm text-slate-400 dark:text-slate-500 text-center py-4 italic">No records</p>
      </div>
    </div>

    <!-- You Owe -->
    <div>
      <h2 class="font-semibold text-red-500 dark:text-red-400 text-sm mb-2 flex items-center gap-1.5">
        <span class="w-2 h-2 bg-red-400 rounded-full"></span>
        You Owe
      </h2>
      <div id="youOweList" class="space-y-2">
        <p class="text-sm text-slate-400 dark:text-slate-500 text-center py-4 italic">No records</p>
      </div>
    </div>

  </main>

  </div>

  <!-- Add Split Modal -->
  <div id="splitModal" class="hidden fixed inset-0 z-50 items-end bg-black/40 backdrop-blur-sm">
    <div class="modal-sheet w-full bg-white dark:bg-gray-900 rounded-t-3xl shadow-2xl">
      <div class="flex justify-center pt-3 pb-2">
        <div class="w-10 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
      </div>
      <div class="px-4 pb-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-slate-900 dark:text-white text-base">Add Record</h3>
          <button id="closeSplitModal" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="splitForm" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Friend's Name</label>
            <input id="splitFriendName" type="text" required placeholder="Enter name"
              class="form-input w-full px-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Amount</label>
            <input id="splitAmount" type="number" required min="0.01" step="0.01" placeholder="0.00"
              class="form-input w-full px-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 text-lg font-bold" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Type</label>
            <select id="splitType" class="form-input w-full px-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 text-sm appearance-none cursor-pointer">
              <option value="owed_to_you">💚 They owe me</option>
              <option value="you_owe">🔴 I owe them</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Note (optional)</label>
            <input id="splitNote" type="text" placeholder="What's this for?"
              class="form-input w-full px-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 text-sm" />
          </div>
          <button id="saveSplit" type="submit"
            class="w-full py-3.5 bg-blue-600 text-white font-semibold rounded-xl text-sm hover:bg-blue-700 transition-colors disabled:opacity-50 mt-2">
            Add Record
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white dark:bg-gray-900 border-t border-slate-100 dark:border-slate-800 px-2 pt-2 pb-safe">
    <div class="flex items-center justify-around max-w-sm mx-auto relative">
      <a href="dashboard.html" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl">
        <svg class="w-5 h-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-xs text-slate-400 dark:text-slate-500">Home</span>
      </a>
      <a href="analytics.html" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl">
        <svg class="w-5 h-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/></svg>
        <span class="text-xs text-slate-400 dark:text-slate-500">Analytics</span>
      </a>

      <!-- FAB -->
      <button id="addSplitBtn" class="fab-btn -mt-6 w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg transition-transform">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
      </button>

      <a href="budget.html" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl">
        <svg class="w-5 h-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        <span class="text-xs text-slate-400 dark:text-slate-500">Budget</span>
      </a>
      <a href="split.html" class="nav-item nav-active flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl">
        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="text-xs text-blue-600 font-semibold">Split</span>
      </a>
      <a href="profile.html" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl">
        <svg class="w-5 h-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs text-slate-400 dark:text-slate-500">Profile</span>
      </a>
    </div>
  </nav>

  <script src="js/firebase.js"></script>
  <script src="js/split.js"></script>
  <script>
    // Add animation to modal open
    const origSetup = window.setupSplitModal;
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('addSplitBtn')?.addEventListener('click', () => {
        setTimeout(() => {
          document.querySelector('#splitModal .modal-sheet')?.classList.add('translate-y-0');
        }, 10);
      });
    });
  </script>
</body>
</html>
